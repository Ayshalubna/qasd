name: Publish model from a finished training run

# Re-runs only the export + report + publish step, using the trained models saved by an earlier
# "Train and publish model" run. Useful when training succeeded but a later step needs a fix (no 1.5 h retrain).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the 'Train and publish model' run whose trained models to use"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QASD_HARDWARE: "GitHub Actions runners (4-core CPU, no GPU), one per method"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: run-*
          path: runs
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export the LoRA model, evaluate int8, write results (fails if a quality gate fails)
        run: python -m scripts.train --skip-training
      - uses: actions/upload-artifact@v4
        with:
          name: results-and-mlflow
          path: |
            eval/
            runs/*/mlruns/
      - name: Publish model to the model branch
        run: |
          mkdir -p /tmp/pub/export && cp -r export/* /tmp/pub/export/ && cp -r eval /tmp/pub/eval
          cd /tmp/pub
          printf '# Qasd model\n\nPublished from training run %s (code %s). See eval/RESULTS.md.\n' "${{ inputs.run_id }}" "$GITHUB_SHA" > README.md
          git init -q -b model
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Model and results from training run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" model
