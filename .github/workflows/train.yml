name: Train and publish model

# Trains full fine-tuning, LoRA and a frozen-encoder baseline on a CPU runner, exports the LoRA model to int8 ONNX,
# and publishes it with its results to the `model` branch (read by the live demo and scripts/fetch_model.py).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["qasd/**", "scripts/train.py", ".github/workflows/train.yml", "requirements-train.txt"]

concurrency:
  group: train
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      QASD_HARDWARE: "GitHub Actions runner (4-core CPU, no GPU)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-distilbert-base-uncased
      - run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt
      - name: Train all methods, export, evaluate (fails if a quality gate fails)
        run: python -m scripts.train
      - name: Upload MLflow runs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-and-results
          path: |
            mlruns/
            eval/
            runs/*/metrics.json
      - name: Publish model to the model branch
        run: |
          mkdir -p /tmp/pub/export && cp -r export/* /tmp/pub/export/ && cp -r eval /tmp/pub/eval
          cd /tmp/pub
          printf '# Qasd model\n\nBuilt by the "Train and publish model" workflow from commit %s. See eval/RESULTS.md.\n' "$GITHUB_SHA" > README.md
          git init -q -b model
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Model and results from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" model
