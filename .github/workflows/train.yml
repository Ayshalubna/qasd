name: Train and publish model

# Trains full fine-tuning, LoRA and a frozen-encoder baseline in three parallel CPU jobs, then exports the LoRA model
# to int8 ONNX and publishes it with its results to the `model` branch (read by the live demo and scripts/fetch_model.py).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["qasd/**", "scripts/train.py", ".github/workflows/train.yml", "requirements-train.txt"]

concurrency:
  group: train
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        method: [head, lora, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-distilbert-base-uncased
      - run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt
      - name: Train ${{ matrix.method }}
        run: python -m qasd.train --method ${{ matrix.method }}
      - name: Keep what the report and export need
        run: |
          mkdir -p keep/${{ matrix.method }}
          cp runs/${{ matrix.method }}/metrics.json runs/${{ matrix.method }}/test_pred.npy keep/${{ matrix.method }}/
          if [ "${{ matrix.method }}" = "lora" ]; then cp -r runs/lora/model runs/lora/adapter keep/lora/; fi
          cp -r mlruns keep/${{ matrix.method }}/mlruns
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.method }}
          path: keep/

  publish:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QASD_HARDWARE: "GitHub Actions runners (4-core CPU, no GPU), one per method"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: run-*
          path: runs
          merge-multiple: true
      - name: Export the LoRA model, evaluate int8, write results (fails if a quality gate fails)
        run: python -m scripts.train --skip-training
      - uses: actions/upload-artifact@v4
        with:
          name: results-and-mlflow
          path: |
            eval/
            runs/*/mlruns/
      - name: Publish model to the model branch
        run: |
          mkdir -p /tmp/pub/export && cp -r export/* /tmp/pub/export/ && cp -r eval /tmp/pub/eval
          cd /tmp/pub
          printf '# Qasd model\n\nBuilt by the "Train and publish model" workflow from commit %s. See eval/RESULTS.md.\n' "$GITHUB_SHA" > README.md
          git init -q -b model
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Model and results from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" model
